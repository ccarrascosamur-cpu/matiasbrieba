<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Portfolio — Matías Brieba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body.portfolio-page nav{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
    }
    body.portfolio-page nav > div:first-child{
      min-width:1px;
    }
    body.portfolio-page .n-logo{
      justify-self:center;
    }
    body.portfolio-page .nav-right{
      justify-self:end;
    }
    body.portfolio-page .n-logo-img{
      width:68px;
      height:68px;
    }
    .port-hero{
      padding:160px 48px 80px;
      border-bottom:1px solid rgba(250,250,250,.06);
    }
    .port-hero h1{
      font-family:'Clash Display',sans-serif;
      font-size:clamp(64px,9vw,140px);
      font-weight:700;line-height:.88;
      letter-spacing:-.03em;color:var(--white);
      margin-bottom:24px;
    }
    .port-hero p{
      font-family:'JetBrains Mono',monospace;
      font-size:11px;letter-spacing:.28em;
      text-transform:uppercase;color:var(--gray);
    }
    .port-filters{
      display:flex;gap:6px;flex-wrap:wrap;align-items:center;
      padding:32px 48px;
      border-bottom:1px solid rgba(250,250,250,.06);
    }
    .pf-btn{
      font-family:'JetBrains Mono',monospace;
      font-size:9px;letter-spacing:.28em;text-transform:uppercase;
      color:rgba(250,250,250,.35);background:none;
      border:1px solid transparent;
      padding:9px 18px;cursor:pointer;
      transition:color .22s,border-color .22s,background .22s;
    }
    .pf-btn:hover{color:rgba(250,250,250,.75);border-color:rgba(250,250,250,.15);}
    .pf-btn.on{color:#f0eeeb;border-color:rgba(250,250,250,.25);background:rgba(250,250,250,.05);}
    .port-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:4px;padding:4px;
    }
    .pg-item{
      position:relative;overflow:hidden;
      aspect-ratio:4/3;background:var(--dark);
      cursor:pointer;
    }
    .pg-item img{
      width:100%;height:100%;object-fit:cover;
      filter:grayscale(.3) brightness(.9);
      transition:transform .7s cubic-bezier(.16,1,.3,1),filter .4s;
    }
    .pg-item:hover img{transform:scale(1.06);filter:grayscale(0) brightness(1);}
    .pg-over{
      position:absolute;inset:0;
      background:linear-gradient(to top,rgba(8,8,8,.95) 0%,transparent 55%);
      opacity:0;transition:opacity .3s;
      display:flex;flex-direction:column;justify-content:flex-end;
      padding:20px;
    }
    .pg-item:hover .pg-over{opacity:1;}
    .pg-cat{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:var(--gray);margin-bottom:5px;}
    .pg-name{font-family:'Clash Display',sans-serif;font-size:clamp(16px,2vw,22px);font-weight:600;color:var(--white);}
    .pg-yr{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--gray);margin-top:4px;}
    @media(max-width:700px){
      .port-grid{grid-template-columns:1fr 1fr;}
      .port-hero{padding:120px 24px 60px;}
      .port-filters{padding:24px;}
      body.portfolio-page .n-logo-img{
        width:58px;
        height:58px;
      }
    }
  </style>
</head>
<body class="portfolio-page">
  <nav id="nav" style="position:fixed;">
    <div></div>
    <a href="index.html" class="n-logo">
      <img src="logomb.png" alt="MB" class="n-logo-img"/>
    </a>
    <div class="nav-right">
      <ul class="n-links" id="nlinks">
        <li><a href="index.html#work" class="nav-link">Work</a></li>
        <li><a href="index.html#about" class="nav-link">About</a></li>
        <li><a href="index.html#services" class="nav-link">Servicios</a></li>
        <li><a href="portfolio.html" class="nav-link nav-cta">Portfolio ↗</a></li>
        <li><a href="index.html#contact" class="nav-link">Contacto</a></li>
      </ul>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="port-hero rv">
    <h1>PORT<br/><span class="out">FOLIO</span></h1>
    <p id="port-count">— proyectos</p>
  </div>

  <div class="port-filters">
    <button class="pf-btn on" data-filter="all">Todos</button>
    <button class="pf-btn" data-filter="film">Film</button>
    <button class="pf-btn" data-filter="foto">Foto</button>
    <button class="pf-btn" data-filter="corp">Corporativo</button>
    <button class="pf-btn" data-filter="deporte">Deportes</button>
  </div>

  <div class="port-grid" id="portGrid"></div>

  <footer>
    <div class="ft-logo">MB © 2026</div>
    <div class="ft-copy">Matías Brieba — Filmmaker &amp; Fotógrafo</div>
    <div class="ft-soc">
      <a href="index.html">Home</a>
      <a href="https://www.instagram.com" target="_blank">Instagram</a>
    </div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:rgba(250,250,250,.18);">
    Desarrollado por <a href="https://www.emmagination.cl" target="_blank" style="color:rgba(250,250,250,.3);text-decoration:none;">Emmagination</a>
  </div>
</footer>

  <script src="js/data.js?v=2"></script>
  <script src="js/portfolio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
