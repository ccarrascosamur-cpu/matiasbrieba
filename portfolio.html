<!DOCTYPE html>

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Portfolio — Matías Brieba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .port-hero{
      padding:160px 48px 80px;
      border-bottom:1px solid rgba(250,250,250,.06);
    }
    .port-hero h1{
      font-family:'Clash Display',sans-serif;
      font-size:clamp(64px,9vw,140px);
      font-weight:700;line-height:.88;
      letter-spacing:-.03em;color:var(--white);
      margin-bottom:24px;
    }
    .port-hero p{
      font-family:'JetBrains Mono',monospace;
      font-size:11px;letter-spacing:.28em;
      text-transform:uppercase;color:var(--gray);
    }
    .port-filters{
      display:flex;gap:12px;flex-wrap:wrap;
      padding:40px 48px;
      border-bottom:1px solid rgba(250,250,250,.06);
    }
    .port-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:4px;padding:4px;
    }
    .pg-item{
      position:relative;overflow:hidden;
      aspect-ratio:4/3;background:var(--dark);
      cursor:pointer;
    }
    .pg-item img{
      width:100%;height:100%;object-fit:cover;
      filter:grayscale(.3) brightness(.9);
      transition:transform .7s cubic-bezier(.16,1,.3,1),filter .4s;
    }
    .pg-item:hover img{transform:scale(1.06);filter:grayscale(0) brightness(1);}
    .pg-over{
      position:absolute;inset:0;
      background:linear-gradient(to top,rgba(8,8,8,.95) 0%,transparent 55%);
      opacity:0;transition:opacity .3s;
      display:flex;flex-direction:column;justify-content:flex-end;
      padding:20px;
    }
    .pg-item:hover .pg-over{opacity:1;}
    .pg-cat{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:var(--gray);margin-bottom:5px;}
    .pg-name{font-family:'Clash Display',sans-serif;font-size:clamp(16px,2vw,22px);font-weight:600;color:var(--white);}
    .pg-yr{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--gray);margin-top:4px;}
    @media(max-width:700px){
      .port-grid{grid-template-columns:1fr 1fr;}
      .port-hero{padding:120px 24px 60px;}
      .port-filters{padding:24px;}
    }
  </style>
</head>
