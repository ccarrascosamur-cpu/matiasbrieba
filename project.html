<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Proyecto — Matías Brieba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    /* ── PROJECT PAGE ── */
    .proj-hero{
      position:relative;
      width:100%;height:100vh;
      overflow:hidden;
      display:flex;align-items:flex-end;
    }
    .proj-hero-bg{
      position:absolute;inset:0;
      background-size:cover;background-position:center;
      filter:grayscale(.2) brightness(.55);
      transition:transform .1s linear;
      will-change:transform;
    }
    .proj-hero-grad{
      position:absolute;inset:0;
      background:linear-gradient(to bottom,transparent 30%,rgba(8,8,8,.97) 100%);
    }
    .proj-hero-content{
      position:relative;z-index:2;
      padding:0 48px 72px;width:100%;
    }
    .proj-breadcrumb{
      font-family:var(--font-mono);
      font-size:9px;letter-spacing:.28em;text-transform:uppercase;
      color:rgba(250,250,250,.4);margin-bottom:20px;
    }
    .proj-breadcrumb a{color:rgba(250,250,250,.4);text-decoration:none;transition:color .2s;}
    .proj-breadcrumb a:hover{color:var(--white);}
    .proj-title{
      font-family:var(--font-display);
      font-size:clamp(52px,8vw,120px);
      font-weight:700;line-height:.9;
      letter-spacing:-.025em;color:var(--white);
      margin-bottom:28px;
    }
    .proj-meta{
      display:flex;align-items:center;gap:32px;flex-wrap:wrap;
    }
    .proj-meta-item{display:flex;flex-direction:column;gap:4px;}
    .proj-meta-label{
      font-family:var(--font-mono);
      font-size:8px;letter-spacing:.3em;text-transform:uppercase;
      color:rgba(250,250,250,.35);
    }
    .proj-meta-val{
      font-family:var(--font-display);
      font-size:14px;font-weight:600;
      color:var(--white);letter-spacing:.05em;
    }
    .proj-meta-sep{width:1px;height:32px;background:rgba(250,250,250,.12);}

    /* BODY */
    .proj-body{
      background:var(--black);
      padding:80px 48px;
      max-width:1200px;margin:0 auto;
    }

    /* DESC */
    .proj-desc{
      display:grid;grid-template-columns:1fr 2fr;gap:80px;
      margin-bottom:80px;
      padding-bottom:80px;
      border-bottom:1px solid var(--border);
    }
    .proj-desc-label{
      font-family:var(--font-mono);
      font-size:9px;letter-spacing:.3em;text-transform:uppercase;
      color:var(--gray);padding-top:4px;
    }
    .proj-desc-text{
      font-size:18px;line-height:1.8;
      color:rgba(250,250,250,.7);
      font-family:var(--font-body);
    }

    /* VIDEO */
    .proj-video-wrap{
      position:relative;width:100%;
      aspect-ratio:16/9;
      background:var(--dark);
      margin-bottom:4px;
      overflow:hidden;
    }
    .proj-video-wrap video,
    .proj-video-wrap iframe{
      position:absolute;inset:0;
      width:100%;height:100%;
      object-fit:cover;border:none;
    }
    .proj-video-label{
      font-family:var(--font-mono);
      font-size:8px;letter-spacing:.28em;text-transform:uppercase;
      color:var(--gray);margin-bottom:64px;margin-top:10px;
    }

    /* GALLERY */
    .proj-gallery{margin-bottom:80px;}
    .proj-gallery-title{
      font-family:var(--font-mono);
      font-size:9px;letter-spacing:.32em;text-transform:uppercase;
      color:var(--gray);margin-bottom:20px;
      display:flex;align-items:center;gap:14px;
    }
    .proj-gallery-title::before{content:'';width:20px;height:1px;background:var(--gray);}
    .proj-gallery-grid{
      display:grid;
      grid-template-columns:repeat(12,1fr);
      gap:4px;
    }
    /* alternating layout for images */
    .gal-img{
      overflow:hidden;background:var(--dark);
      cursor:pointer;
    }
    .gal-img img{
      width:100%;height:100%;object-fit:cover;display:block;
      filter:grayscale(.2) brightness(.9);
      transition:transform .7s cubic-bezier(.16,1,.3,1),filter .4s;
    }
    .gal-img:hover img{transform:scale(1.05);filter:grayscale(0) brightness(1);}

    /* layout patterns cycling */
    .gal-img:nth-child(6n+1){grid-column:span 8;aspect-ratio:16/10;}
    .gal-img:nth-child(6n+2){grid-column:span 4;aspect-ratio:4/5;}
    .gal-img:nth-child(6n+3){grid-column:span 4;aspect-ratio:4/5;}
    .gal-img:nth-child(6n+4){grid-column:span 8;aspect-ratio:16/10;}
    .gal-img:nth-child(6n+5){grid-column:span 6;aspect-ratio:4/3;}
    .gal-img:nth-child(6n+6){grid-column:span 6;aspect-ratio:4/3;}

    /* LIGHTBOX */
    .lightbox{
      position:fixed;inset:0;
      background:rgba(8,8,8,.96);
      z-index:900;
      display:none;align-items:center;justify-content:center;
      backdrop-filter:blur(8px);
    }
    .lightbox.open{display:flex;}
    .lightbox-img{
      max-width:92vw;max-height:90vh;
      object-fit:contain;display:block;
    }
    .lightbox-close{
      position:absolute;top:24px;right:28px;
      font-family:var(--font-mono);
      font-size:10px;letter-spacing:.22em;text-transform:uppercase;
      color:rgba(250,250,250,.5);background:none;border:none;
      cursor:pointer;transition:color .2s;
    }
    .lightbox-close:hover{color:var(--white);}
    .lightbox-prev,.lightbox-next{
      position:absolute;top:50%;transform:translateY(-50%);
      background:none;border:1px solid rgba(250,250,250,.15);
      color:var(--white);
      width:44px;height:44px;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:border-color .2s,background .2s;
    }
    .lightbox-prev{left:24px;}
    .lightbox-next{right:24px;}
    .lightbox-prev:hover,.lightbox-next:hover{background:rgba(250,250,250,.08);border-color:rgba(250,250,250,.4);}
    .lightbox-prev svg,.lightbox-next svg{width:16px;height:16px;stroke:var(--white);fill:none;stroke-width:1.5;}

    /* NEXT PROJECT */
    .proj-next{
      border-top:1px solid var(--border);
      padding:64px 48px;
      display:flex;justify-content:space-between;align-items:center;
      background:var(--off-black);
      cursor:pointer;
      transition:background .3s;
      text-decoration:none;
    }
    .proj-next:hover{background:var(--dark);}
    .proj-next-label{
      font-family:var(--font-mono);
      font-size:9px;letter-spacing:.3em;text-transform:uppercase;
      color:var(--gray);margin-bottom:10px;
    }
    .proj-next-name{
      font-family:var(--font-display);
      font-size:clamp(28px,4vw,56px);
      font-weight:700;color:var(--white);
      letter-spacing:-.02em;
    }
    .proj-next-arrow{
      font-family:var(--font-display);
      font-size:48px;color:rgba(250,250,250,.2);
      transition:color .3s,transform .3s;
    }
    .proj-next:hover .proj-next-arrow{color:var(--white);transform:translateX(8px);}

    /* EMPTY STATE */
    .proj-empty{
      padding:120px 48px;text-align:center;
    }
    .proj-empty h2{
      font-family:var(--font-display);
      font-size:48px;font-weight:700;color:var(--white);margin-bottom:16px;
    }
    .proj-empty p{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--gray);}

    @media(max-width:900px){
      .proj-hero-content{padding:0 20px 52px;}
      .proj-body{padding:56px 20px;}
      .proj-desc{grid-template-columns:1fr;gap:24px;}
      .proj-gallery-grid{grid-template-columns:1fr 1fr;gap:3px;}
      .gal-img{grid-column:span 1!important;aspect-ratio:4/3!important;}
      .proj-next{padding:40px 20px;}
    }
  </style>
</head>
<body>
  <nav id="nav" class="scrolled">
    <a href="index.html" class="n-logo">
      <img class="n-logo-img" src="https://cdn.myportfolio.com/99e3222b-7b10-4664-a4cf-206afa74b111/0c3864eb-30af-45f4-9fbc-2a8c27377bd4_rwc_0x0x1542x1542x4096.png?h=1d173751776d0296528023ed82d96617" alt="MB"/>
      <span class="n-name">Matías Brieba</span>
    </a>
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    <ul class="n-links" id="nlinks">
      <li><a href="index.html#work">Work</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#services">Servicios</a></li>
      <li><a href="portfolio.html" target="_blank" class="nav-cta">Portfolio ↗</a></li>
      <li><a href="index.html#contact">Contacto</a></li>
    </ul>
  </nav>

  <!-- Rendered by JS -->
  <div id="projRoot"></div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">ESC / Cerrar</button>
    <button class="lightbox-prev" onclick="lbNav(-1)">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <img class="lightbox-img" id="lbImg" src="" alt=""/>
    <button class="lightbox-next" onclick="lbNav(1)">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <!-- WhatsApp -->
  <a href="https://wa.me/56991344540" target="_blank" class="wa-float" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <script src="js/data.js"></script>
  <script>
    const CATL = {film:'Film',foto:'Fotografía',corp:'Corporativo',deporte:'Deportes'};

    // Get project ID from URL ?id=X
    const params = new URLSearchParams(location.search);
    const projId = parseInt(params.get('id'));
    let lbImgs = [];

    function getProjectState(){
      const data = getMBData();
      const projects = Array.isArray(data.projects) ? data.projects : [];
      const project = projects.find(p => p.id === projId);
      const nextProject = project && projects.length
        ? projects[(projects.indexOf(project) + 1) % projects.length]
        : null;
      return { project, nextProject };
    }

    function render(){
      const { project: proj, nextProject: nextProj } = getProjectState();
      const root = document.getElementById('projRoot');
      if(!proj){
        root.innerHTML = `<div class="proj-empty"><h2>Proyecto no encontrado</h2><p><a href="portfolio.html" style="color:var(--white)">← Volver al portfolio</a></p></div>`;
        return;
      }
      document.title = `${proj.name} — Matías Brieba`;

      const imgs = (proj.images || []).map(src => fixImgUrl(src)).filter(Boolean);
      const videoUrls = Array.isArray(proj.videos) && proj.videos.length
        ? proj.videos
        : (proj.videoUrl ? [proj.videoUrl] : []);

      let videoBlock = '';
      if(videoUrls.length){
        videoBlock = videoUrls.map((videoUrl, index) => {
          const media = typeof parseProjectVideo === 'function' ? parseProjectVideo(videoUrl) : null;
          if(!media) return '';
          if(media.type === 'iframe'){
            return `
              <div class="proj-video-wrap">
                <iframe src="${media.src}" loading="lazy" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>
              </div>
              <p class="proj-video-label">${videoUrls.length > 1 ? `Video ${index + 1}` : 'Video'} — ${proj.name}</p>`;
          }
          return `
            <div class="proj-video-wrap">
              <video src="${media.src}" controls playsinline preload="metadata"></video>
            </div>
            <p class="proj-video-label">${videoUrls.length > 1 ? `Video ${index + 1}` : 'Video'} — ${proj.name}</p>`;
        }).join('');
      }

      // Gallery
      let galleryBlock = '';
      if(imgs.length){
        lbImgs = imgs;
        galleryBlock = `
          <div class="proj-gallery">
            <p class="proj-gallery-title">Galería</p>
            <div class="proj-gallery-grid" id="galGrid">
              ${imgs.map((src,i) => `
                <div class="gal-img" onclick="openLightbox(${i})">
                  <img src="${src}" alt="${proj.name} ${i+1}" loading="lazy" onerror="this.parentNode.style.display='none'"/>
                </div>`).join('')}
            </div>
          </div>`;
      }

      root.innerHTML = `
        <!-- HERO -->
        <section class="proj-hero">
          <div class="proj-hero-bg" id="projBg" style="background-image:url('${fixImgUrl(proj.img)}')"></div>
          <div class="proj-hero-grad"></div>
          <div class="proj-hero-content">
            <p class="proj-breadcrumb"><a href="portfolio.html">Portfolio</a> &nbsp;/&nbsp; ${CATL[proj.cat]||proj.cat}</p>
            <h1 class="proj-title">${proj.name}</h1>
            <div class="proj-meta">
              <div class="proj-meta-item">
                <span class="proj-meta-label">Cliente</span>
                <span class="proj-meta-val">${proj.client||proj.name}</span>
              </div>
              <div class="proj-meta-sep"></div>
              <div class="proj-meta-item">
                <span class="proj-meta-label">Categoría</span>
                <span class="proj-meta-val">${CATL[proj.cat]||proj.cat}</span>
              </div>
              <div class="proj-meta-sep"></div>
              <div class="proj-meta-item">
                <span class="proj-meta-label">Año</span>
                <span class="proj-meta-val">${proj.year}</span>
              </div>
            </div>
          </div>
        </section>

        <!-- BODY -->
        <div class="proj-body">
          <!-- DESC -->
          <div class="proj-desc rv">
            <p class="proj-desc-label">Sobre el proyecto</p>
            <p class="proj-desc-text">${proj.desc || 'Proyecto de fotografía y producción audiovisual.'}</p>
          </div>

          <!-- VIDEO -->
          ${videoBlock}

          <!-- GALLERY -->
          ${galleryBlock}
        </div>

        <!-- NEXT PROJECT -->
        ${nextProj && nextProj.id !== proj.id ? `
        <a href="project.html?id=${nextProj.id}" class="proj-next rv">
          <div>
            <p class="proj-next-label">Siguiente proyecto</p>
            <p class="proj-next-name">${nextProj.name}</p>
          </div>
          <span class="proj-next-arrow">→</span>
        </a>` : ''}
      `;

      // Parallax on hero bg
      const bg = document.getElementById('projBg');
      if(bg){
        window.addEventListener('scroll',()=>{
          bg.style.transform = `translateY(${scrollY*.3}px)`;
        },{passive:true});
      }

      // Reveal
      setTimeout(()=>{
        const obs = new IntersectionObserver(en=>{
          en.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target);}});
        },{threshold:.08});
        document.querySelectorAll('.rv').forEach(el=>obs.observe(el));
      },100);
    }

    // LIGHTBOX
    let lbIndex = 0;

    function openLightbox(i){
      lbIndex = i;
      document.getElementById('lbImg').src = lbImgs[i];
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox(){
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }
    function lbNav(dir){
      lbIndex = (lbIndex + dir + lbImgs.length) % lbImgs.length;
      document.getElementById('lbImg').src = lbImgs[lbIndex];
    }
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape') closeLightbox();
      if(e.key==='ArrowRight') lbNav(1);
      if(e.key==='ArrowLeft') lbNav(-1);
    });

    // NAV
    const nav=document.getElementById('nav');
    window.addEventListener('scroll',()=>{
      nav.classList.toggle('scrolled',scrollY>60);
    },{passive:true});
    const ham=document.getElementById('hamburger'),nl=document.getElementById('nlinks');
    ham.addEventListener('click',()=>{ham.classList.toggle('open');nl.classList.toggle('open');});
    nl.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{
      ham.classList.remove('open');nl.classList.remove('open');
    }));

    window.addEventListener('mb:data-updated', render);
    render();
  </script>
</body>
</html>
